spring.application.name=gestion-pharmacie
server.port=8080

# ---- MySQL ----
# La base est créée automatiquement si elle n'existe pas.
spring.datasource.url=jdbc:mysql://localhost:3306/pharmacie_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
# Garde les noms exacts des tables/colonnes (detailProduit, paysOrigine...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ---- Jeu de données (src/main/resources/data.sql) ----
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
