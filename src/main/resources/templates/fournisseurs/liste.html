<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fournisseurs')}"></head>
<body>
<header th:replace="~{fragments/layout :: entete}"></header>
<main>
    <h2>Fournisseurs</h2>
    <table>
        <thead><tr><th>#</th><th>Nom</th><th>Contact</th><th>Adresse</th><th>Produits fournis</th></tr></thead>
        <tbody>
        <tr th:each="f : ${fournisseurs}">
            <td th:text="${f.id}">1</td>
            <td th:text="${f.nom}">nom</td>
            <td th:text="${f.contact}">contact</td>
            <td th:text="${f.adresse}">adresse</td>
            <td><span class="badge" th:each="p : ${f.produits}" th:text="${p.nom}">produit</span></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
